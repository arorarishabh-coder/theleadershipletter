<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TLL avatar B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,30..100;1,9..144,300..900,30..100&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1A1A1F; }
  .avatar {
    width: 400px;
    height: 400px;
    background: #1A1A1F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', Georgia, serif;
    position: relative;
  }
  .mark {
    font-size: 360px;
    line-height: 0.85;
    font-style: italic;
    font-variation-settings: "opsz" 144, "wght" 400, "SOFT" 100;
    color: #F4EFE6;
    letter-spacing: -0.04em;
  }
  .corner {
    position: absolute;
    top: 24px;
    right: 24px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: #F4EFE6;
    opacity: 0.55;
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }
</style>
</head>
<body>
  <div class="avatar">
    <div class="corner">№ 01</div>
    <div class="mark">L</div>
  </div>
</body>
</html>
