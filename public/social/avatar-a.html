<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TLL avatar A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,30..100;1,9..144,300..900,30..100&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F4EFE6; }
  .avatar {
    width: 400px;
    height: 400px;
    background: #F4EFE6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'Fraunces', Georgia, serif;
  }
  .mark {
    font-size: 320px;
    line-height: 0.85;
    font-style: italic;
    font-variation-settings: "opsz" 144, "wght" 400, "SOFT" 100;
    color: #1A1A1F;
    letter-spacing: -0.04em;
    margin-top: -6px;
  }
  .rule {
    width: 60px;
    height: 3px;
    background: #8E2A1F;
    margin-top: 18px;
  }
  .label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    color: #1A1A1F;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    margin-top: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="avatar">
    <div class="mark">L</div>
    <div class="rule"></div>
    <div class="label">Leadership Letter</div>
  </div>
</body>
</html>
