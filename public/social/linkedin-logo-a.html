<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LinkedIn logo A — editorial frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,30..100;1,9..144,300..900,30..100&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F4EFE6; }
  .logo {
    width: 400px;
    height: 400px;
    background: #F4EFE6;
    font-family: 'Fraunces', Georgia, serif;
    color: #1A1A1F;
    position: relative;
    box-sizing: border-box;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .topbar {
    position: absolute;
    top: 22px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #5E5A52;
  }
  .topbar .brick { color: #8E2A1F; }
  .mark {
    font-size: 300px;
    line-height: 0.85;
    font-style: italic;
    font-variation-settings: "opsz" 144, "wght" 400, "SOFT" 100;
    color: #1A1A1F;
    letter-spacing: -0.04em;
    margin-top: -10px;
  }
  .footrule {
    position: absolute;
    bottom: 60px;
    left: 24px;
    right: 24px;
    height: 1.5px;
    background: #1A1A1F;
  }
  .foot {
    position: absolute;
    bottom: 28px;
    left: 24px;
    right: 24px;
    text-align: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: #1A1A1F;
  }
</style>
</head>
<body>
  <div class="logo">
    <div class="topbar">
      <span>Daily edition</span>
      <span class="brick">Est. 2026</span>
    </div>
    <div class="mark">L</div>
    <div class="footrule"></div>
    <div class="foot">The Leadership Letter</div>
  </div>
</body>
</html>
