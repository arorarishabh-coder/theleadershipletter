<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LinkedIn cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,30..100;1,9..144,300..900,30..100&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F4EFE6; }
  .cover {
    width: 1128px;
    height: 191px;
    background: #F4EFE6;
    font-family: 'Fraunces', Georgia, serif;
    color: #1A1A1F;
    display: flex;
    align-items: center;
    position: relative;
    box-sizing: border-box;
    /* LinkedIn overlays the company logo as a square at bottom-left, ~130x130px
       starting ~24px from the left. Reserve that zone. */
    padding-left: 180px;
    padding-right: 32px;
    overflow: hidden;
  }
  .topbar {
    position: absolute;
    top: 14px;
    left: 32px;
    right: 32px;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #5E5A52;
  }
  .topbar .brick { color: #8E2A1F; }
  .footbar {
    position: absolute;
    bottom: 12px;
    left: 180px;
    right: 32px;
    border-top: 1px solid #1A1A1F;
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #5E5A52;
  }
  .text {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .masthead {
    font-size: 56px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 144, "wght" 500, "SOFT" 30;
  }
  .masthead em {
    font-style: italic;
    font-variation-settings: "opsz" 144, "wght" 400, "SOFT" 100;
    font-weight: normal;
  }
  .tagline {
    margin-top: 6px;
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-size: 19px;
    color: #5E5A52;
    line-height: 1.25;
    font-variation-settings: "opsz" 22;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="topbar">
      <span>Daily edition · Free · No filler</span>
      <span class="brick">Est. 2026 · theleadershipletter.com</span>
    </div>
    <div class="text">
      <div class="masthead">The Leadership <em>Letter</em></div>
      <div class="tagline">Real correspondence from the people running real companies — and what it reveals about leadership.</div>
    </div>
    <div class="footbar">
      <span>One letter · One lesson</span>
      <span>Every weekday morning</span>
    </div>
  </div>
</body>
</html>
