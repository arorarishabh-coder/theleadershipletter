name: Generate content

# Weekly content replenishment. Discovers + ingests fresh posts (Claude API),
# runs the content-QA gate, and opens a PR. Merging the PR auto-deploys the new
# posts to production (Vercel deploys from main), where they enter the daily-send
# buffer. Keeps the newsletter from silently running dry.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      edgar_limit:
        description: "EDGAR marquee discovery limit"
        default: "10"
      doj_limit:
        description: "DOJ exhibits discovery limit"
        default: "6"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # qa:content diffs new posts vs origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Runway before
        run: |
          echo "### Buffer before" | tee runway-before.txt
          npm run -s qa:runway 2>&1 | tee -a runway-before.txt || true

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e  # a weak source must not abort the run; the QA gate is the arbiter
          echo "== RECAP watchlist sweep =="
          npm run discover -- --ingest --limit=4
          echo "== EDGAR marquee =="
          npm run discover -- --from-edgar --marquee --ingest --limit="${{ github.event.inputs.edgar_limit || '10' }}"
          echo "== DOJ exhibits =="
          npm run discover -- --from-doj --ingest --limit="${{ github.event.inputs.doj_limit || '6' }}"
          set -e

      - name: Sync RECAP search alerts
        if: ${{ env.COURTLISTENER_API_TOKEN != '' }}
        env:
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
        run: npm run -s alerts || true

      - name: Detect new posts
        id: detect
        run: |
          NEW=$(git ls-files --others --exclude-standard -- content/posts | grep '\.json$' || true)
          CHANGED=$(git diff --name-only --diff-filter=AM origin/main -- content/posts | grep '\.json$' || true)
          COUNT=$(printf "%s\n%s\n" "$NEW" "$CHANGED" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Generated/changed posts: $COUNT"
          printf "%s\n%s\n" "$NEW" "$CHANGED" | sed '/^$/d' | sort -u

      - name: Content QA gate
        id: qa
        if: steps.detect.outputs.count != '0'
        continue-on-error: true # report in the PR rather than discarding good posts
        run: |
          npm run qa:content -- --base=origin/main --json 2>&1 | tee qa-content.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        if: steps.detect.outputs.count != '0'
        run: |
          {
            echo "Automated weekly content batch — **${{ steps.detect.outputs.count }}** new/updated post(s)."
            echo
            if [ "${{ steps.qa.outputs.exit }}" = "0" ]; then
              echo "✅ Content-QA gate passed."
            else
              echo "⚠️ **Content-QA gate reported errors — review before merging.**"
            fi
            echo
            echo "<details><summary>QA report</summary>"
            echo
            echo '```'
            sed -n '/QA_CONTENT_JSON/!p' qa-content.txt || true
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>Buffer runway</summary>"
            echo
            echo '```'
            cat runway-before.txt || true
            echo '```'
            echo "</details>"
            echo
            echo "_Merging deploys these posts to production automatically._"
          } > pr-body.md
          cat pr-body.md

      - name: Open PR
        if: steps.detect.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: auto/content-${{ github.run_id }}
          add-paths: |
            content/posts
            public/screenshots
          commit-message: "Content: automated weekly batch (${{ steps.detect.outputs.count }} posts)"
          title: "Content: weekly batch — ${{ steps.detect.outputs.count }} posts"
          body-path: pr-body.md
          labels: ${{ steps.qa.outputs.exit == '0' && 'automated-content' || 'automated-content,needs-fix' }}

      - name: Fail if QA errored
        if: steps.detect.outputs.count != '0' && steps.qa.outputs.exit != '0'
        run: |
          echo "Content-QA gate found errors — PR opened with 'needs-fix' label; do not merge until resolved."
          exit 1
